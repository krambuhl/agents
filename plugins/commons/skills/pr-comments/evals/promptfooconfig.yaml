# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# pr-comments regression suite. run from the repository root:
#   npm run eval:pr-comments
# the provider loads the commons plugin straight from this tree, so the skill
# under test is the file next door, not an installed copy. the agent gets no
# github tools and cannot edit files: every case hands it one thread plus the
# code it points at, and asks for the procedure's four sections. write-as-me is
# enabled too, since the skill sends every posted line through it.
description: pr-comments regression suite
sharing: false

prompts:
  - file://prompt.txt

providers:
  - id: anthropic:claude-agent-sdk
    label: claude-pr-comments
    config:
      apiKeyRequired: false
      working_dir: .
      setting_sources: []
      plugins:
        - type: local
          path: ../../..
      skills: [commons:pr-comments, commons:write-as-me]
      model: sonnet
      max_turns: 8
      tools: [Read, Skill]
      custom_allowed_tools: [Read]
      disallowed_tools: [Bash, Edit, Write, Grep, Glob, WebFetch, WebSearch, Task]
      permission_mode: dontAsk
      persist_session: false

defaultTest:
  assert:
    - type: skill-used
      value:
        name: commons:pr-comments
      metric: skill_routing
    - type: not-is-refusal
      metric: useful_response
    - type: icontains-all
      value:
        - 'verification:'
        - 'class:'
        - 'action:'
        - 'post:'
      metric: procedure_shape
    - type: skill-used
      value:
        name: commons:write-as-me
      metric: prose_handoff
    - type: javascript
      value: file://../../../evals/lib/post-section.js
      metric: posted_text_register
    - type: javascript
      value: file://../../../evals/lib/post-readability.js
      metric: posted_text_readability
    - type: not-icontains-any
      value:
        - as an ai
        - as a language model
        - snerf
      metric: no_agent_voice
    - type: word-count
      value:
        max: 450
      metric: response_efficiency
    - type: llm-rubric
      value: '{{rubric}}'
      threshold: 0.8
      metric: semantic_correctness
      provider:
        id: anthropic:messages:claude-sonnet-4-6
        config:
          apiKeyRequired: false

tests:
  - file://tests.yaml

commandLineOptions:
  maxConcurrency: 1
  cache: false
