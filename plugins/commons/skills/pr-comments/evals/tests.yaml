# pr-comments regression cases. each case is one review thread on a pr the
# agent is driving. the skill is a procedure, so the cases check the
# procedure: did it verify the claim against the code, classify correctly,
# and pick the right action. how the posted text reads is write-as-me's
# concern, and the shared lowercase and punctuation checks cover it.

- description: a nit whose fix is already pushed
  metadata:
    suite: pr-comments
    case_id: nit-fixed
    kind: fix
  vars:
    goal: the reviewer left a nit. the fix is already pushed as 9e1f2ab. close the thread out.
    artifact: file://fixtures/thread-nit-fixed.md
    rubric: >-
      pass only if the class is fix, the action is to reply with the commit
      and resolve the thread, and the posted text says the fix is in with the
      sha and briefly what changed, then stops. fail if it re-argues the nit,
      apologizes, runs past three sentences, or recaps what the reviewer can
      already see in the diff.
  assert:
    - type: regex
      value: 'class:\s*fix'
      metric: classification
    - type: icontains
      value: 9e1f2ab
      metric: points_at_commit
    - type: icontains
      value: resolve
      metric: procedure

- description: a bot finding that is correct and not yet fixed
  metadata:
    suite: pr-comments
    case_id: bot-finding-fix
    kind: fix
  vars:
    goal: coderabbit left a finding. work the thread.
    artifact: file://fixtures/coderabbit.md
    rubric: >-
      pass only if verification confirms the claim by pointing at the catch
      block that swallows every error, the class is fix, the action includes
      a code change that rethrows abort errors before retrying plus a test for
      a cancelled request, and the post says what changed. fail if it
      dismisses the bot or treats the finding as a matter of opinion.
  assert:
    - type: regex
      value: 'class:\s*fix'
      metric: classification
    - type: icontains
      value: abort
      metric: verification
    - type: icontains-any
      value:
        - test
        - it(
      metric: adds_test

- description: a reviewer claim the code disproves
  metadata:
    suite: pr-comments
    case_id: incorrect-claim
    kind: decline
  vars:
    goal: the reviewer is blocking on a claim about the retry loop. work the thread.
    artifact: file://fixtures/thread-incorrect-claim.md
    rubric: >-
      pass only if verification points at the MAX_ATTEMPTS constant on line 1
      and the passing test that proves the loop stops after three attempts,
      the class is decline, and the post gives that evidence plainly without
      condescension and without changing code. fail if it changes the code to
      appease the reviewer or resolves the thread itself.
  assert:
    - type: regex
      value: 'class:\s*decline'
      metric: classification
    - type: icontains
      value: MAX_ATTEMPTS
      metric: verification
    - type: regex
      value: "(leave|leaves|stays?|remains?|keep|keeps) (the |this )?(thread )?open|(not|n't|never) (resolve|resolving)"
      metric: leaves_thread_open

- description: a question the code answers
  metadata:
    suite: pr-comments
    case_id: question
    kind: answer
  vars:
    goal: the reviewer asked how the backoff behaves. work the thread.
    artifact: file://fixtures/thread-question.md
    rubric: >-
      pass only if the class is answer and the post states the actual
      behavior from backoff.ts (doubling from 200ms, up to 100ms jitter,
      capped at 2s) and names the file. fail if it guesses, hedges, or
      proposes a code change nobody asked for.
  assert:
    - type: regex
      value: 'class:\s*answer'
      metric: classification
    - type: icontains-all
      value:
        - '200'
        - '2000'
      metric: answers_from_code
    - type: icontains
      value: backoff.ts
      metric: cites_location

- description: a reviewer argues an architecture position
  metadata:
    suite: pr-comments
    case_id: decide
    kind: decide
  vars:
    goal: the reviewer wants an architecture decision before merge. work the thread.
    artifact: file://fixtures/thread-architecture.md
    rubric: >-
      pass only if the class is decide, nothing is posted, and the engineer
      gets a ready-to-paste draft plus one line on what the thread asks and
      why it is their call. the draft may take a position, since the engineer
      chooses whether to send it. fail if the agent posts a stance itself.
  assert:
    - type: regex
      value: 'class:\s*decide'
      metric: classification
    - type: icontains
      value: handed to the engineer
      metric: no_autonomous_post
    - type: icontains
      value: draft
      metric: provides_draft

- description: a thread that needs another team's call
  metadata:
    suite: pr-comments
    case_id: route
    kind: route
  vars:
    goal: the reviewer raised a payments idempotency concern the engineer cannot answer alone. work the thread.
    artifact: file://fixtures/thread-security.md
    rubric: >-
      pass only if the class is route, the post names the payments team as
      the owner of the call and says what is needed from them, and nothing in
      the post guesses their stance or asserts a convention the material
      does not record.
  assert:
    - type: regex
      value: 'class:\s*route'
      metric: classification
    - type: icontains
      value: payments
      metric: routes_to_owner
    - type: regex
      value: "(leave|leaves|stays?|remains?|keep|keeps) (the |this )?(thread )?open|(not|n't|never) (resolve|resolving)"
      metric: leaves_thread_open
