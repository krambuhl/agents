# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# write-as-me regression suite. run from the repository root:
#   npm run eval:write-as-me
# the provider loads the commons plugin straight from this tree, so the skill
# under test is the file next door, not an installed copy.
description: write-as-me regression suite
sharing: false

prompts:
  - file://prompt.txt

providers:
  - id: anthropic:claude-agent-sdk
    label: claude-write-as-me
    config:
      apiKeyRequired: false
      working_dir: .
      setting_sources: []
      plugins:
        - type: local
          path: ../../..
      skills: [commons:write-as-me]
      model: sonnet
      max_turns: 6
      tools: [Read, Skill]
      custom_allowed_tools: [Read]
      disallowed_tools: [Bash, Edit, Write, Grep, Glob, WebFetch, WebSearch, Task]
      permission_mode: dontAsk
      persist_session: false

defaultTest:
  assert:
    - type: skill-used
      value:
        name: commons:write-as-me
      metric: skill_routing
    - type: not-is-refusal
      metric: useful_response
    - type: not-regex
      value: '[—–]'
      metric: punctuation
    - type: javascript
      value: file://../../../evals/lib/lowercase.js
      metric: lowercase
    - type: not-icontains
      value: snerf
      metric: no_agent_voice
    - type: not-icontains
      value: as an ai
      metric: no_agent_voice
    - type: not-icontains
      value: generated by
      metric: no_agent_voice
    - type: word-count
      value:
        max: 450
      metric: response_efficiency
    - type: llm-rubric
      value: '{{rubric}}'
      threshold: 0.8
      metric: semantic_correctness
      provider:
        id: anthropic:messages:claude-sonnet-4-6
        config:
          apiKeyRequired: false

tests:
  - file://tests.yaml

commandLineOptions:
  maxConcurrency: 1
  cache: false
